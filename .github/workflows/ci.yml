name: Verify
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.4
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/grantdiff
  packages:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.4
      - id: version
        run: echo "version=$(go run ./cmd/grantdiff version)" >> "$GITHUB_OUTPUT"
      - run: go run ./scripts/release --version "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-packages
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
  package-test:
    needs: packages
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-packages
          path: dist
      - run: python -m pip install -r scripts/packagecheck/requirements.txt
      - run: python scripts/packagecheck/verify.py --version "$RELEASE_VERSION" --result ".work/package-$PACKAGE_PLATFORM.json"
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.packages.outputs.version }}
          PACKAGE_PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-check-${{ matrix.platform }}
          include-hidden-files: true
          path: .work/package-*.json
  package-parity:
    needs: package-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: package-check-*
          merge-multiple: true
          path: .work/package-checks
      - run: python -m pip install -r scripts/packagecheck/requirements.txt
      - run: python scripts/packagecheck/verify.py --compare .work/package-checks
  kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v1.35.8
            image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          - version: v1.36.4
            image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - version: v1.37.0
            image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.4
      - run: go install sigs.k8s.io/kind@v0.33.0
      - run: |
          mkdir -p .work
          go run ./scripts/integration --image "$NODE_IMAGE" --result .work/verification.json 2>&1 | tee .work/integration.log
        shell: bash
        env:
          NODE_IMAGE: ${{ matrix.image }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-${{ matrix.version }}
          include-hidden-files: true
          path: |
            .work/verification*.json
            .work/*.log
            .work/failures/**
