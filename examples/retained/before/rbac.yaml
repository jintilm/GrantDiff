apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: report-reader
  namespace: finance
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [billing-config]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: direct-read
  namespace: finance
subjects:
  - kind: ServiceAccount
    name: report-bot
    namespace: finance
roleRef:
  kind: Role
  name: report-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: group-read
  namespace: finance
subjects:
  - kind: Group
    name: system:serviceaccounts:finance
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: report-reader
  apiGroup: rbac.authorization.k8s.io
