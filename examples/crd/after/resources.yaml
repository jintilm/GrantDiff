apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.test
spec:
  group: example.test
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
      subresources:
        status: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: widget-reader
  namespace: apps
rules:
  - apiGroups: [example.test]
    resources: [widgets]
    verbs: [get, list]
  - apiGroups: [example.test]
    resources: [widgets/status]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: widget-access
  namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: widget-reader
subjects:
  - kind: ServiceAccount
    name: widget-bot
    namespace: apps
